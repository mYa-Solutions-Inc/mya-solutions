# FILE / ROOT:  .github/workflows/site-index.yml  (mYa Solutions website)
# DESCRIPTION:  Keeps Jean's site index in step with the pages. On every push to
#               main that touches a page, rebuilds assets/jean/site-index.json
#               and commits it if anything changed. Jean's service re-reads the
#               index from the live site every 10 minutes, so no redeploy needed.
name: Rebuild Jean's site index
on:
  push:
    branches: [main]
    paths: ["**.html", "tools/build_site_index.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-index
  cancel-in-progress: true
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the index
        run: python3 tools/build_site_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Index already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A assets/jean/site-index.json $(git diff --name-only -- '*.html')
          git commit -m "Rebuild Jean's site index"
          git push
